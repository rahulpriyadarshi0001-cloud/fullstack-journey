<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>CSS-Animations</title>
</head>
<body>
  <nav class="navbar">
    <div class="logo">Rahul.dev</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
    </ul>
  </nav>

  <main>
    <section class="hero">
      <h1 class="fade-in">Hi, I'm Rahul 👋</h1>
      <p class="fade-in delay-1">Building cool things with code.</p>
      <div class="btn-group fade-in delay-2">
        <button class="btn btn-primary">See My Work</button>
        <button class="btn btn-outline">Contact Me</button>
      </div>
    </section>

    <section class="loader-section">
      <h2>Loading States</h2>
      <div class="loaders">
        <div class="spinner"></div>
        <div class="pulse-dot"></div>
        <div class="bounce-ball"></div>
      </div>
    </section>

    <section class="cards-section">
      <h2>Hover Effects</h2>
      <div class="cards">
        <div class="card">
          <div class="card-icon">⚡</div>
          <h3>Fast</h3>
          <p>Optimized for speed.</p>
        </div>
        <div class="card">
          <div class="card-icon">🎨</div>
          <h3>Beautiful</h3>
          <p>Designed with care.</p>
        </div>
        <div class="card">
          <div class="card-icon">🚀</div>
          <h3>Modern</h3>
          <p>Built with latest tech.</p>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
